[project]
name = "xai-audio-deepfake-shortcuts-audit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "moonrnr", email = "moonrnr@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10",
    "pandas>=2.3",
    "soundfile>=0.14.0",
]

[project.scripts]
xai-audio-deepfake-shortcuts-audit = "xai_audio_deepfake_shortcuts_audit:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.1.1",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
